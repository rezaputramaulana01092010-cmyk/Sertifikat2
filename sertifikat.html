<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System - GTA Tournament</title>
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-gold: #f39c12;
            --accent-cyan: #66fcf1;
            --text-light: #c5c6c7;
            --text-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(243, 156, 18, 0.08) 0%, transparent 80%),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(243, 156, 18, 0.2);
            text-align: center;
            position: relative;
        }

        .gta-logo {
            font-size: 22pt;
            font-weight: 800;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        .sub-title {
            font-size: 9pt;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 9pt;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            color: var(--accent-gold);
            font-size: 11pt;
        }

        .input-box input {
            width: 100%;
            padding: 12px 12px 12px 42px;
            background-color: #0b0c10;
            border: 1px solid #333;
            border-radius: 6px;
            color: var(--text-white);
            font-size: 10pt;
            transition: all 0.3s ease;
        }

        .input-box input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 8px rgba(243, 156, 18, 0.4);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            border-radius: 6px;
            color: var(--text-white);
            font-size: 11pt;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
        }

        .btn-login:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        .device-info-badge {
            margin-top: 25px;
            padding: 10px;
            background-color: #0b0c10;
            border-radius: 6px;
            border: 1px dashed #333;
            font-size: 8pt;
            color: #888;
            line-height: 1.4;
        }

        .device-info-badge strong {
            color: var(--accent-cyan);
        }

        .alert-box {
            padding: 10px;
            border-radius: 6px;
            font-size: 9pt;
            margin-bottom: 15px;
            display: none;
        }

        .alert-danger {
            background-color: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #ff6b6b;
        }

        .alert-success {
            background-color: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="gta-logo">GTA CHAMPIONSHIP</div>
        <div class="sub-title">Single Device Portal</div>

        <div id="alertBox" class="alert-box"></div>

        <form id="loginForm" onsubmit="event.preventDefault(); processLogin();">
            <div class="form-group">
                <label for="username">Username Peserta</label>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="Masukkan username..." required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password Access</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Masukkan password..." required>
                </div>
            </div>

            <button type="submit" id="btnLogin" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
            </button>
        </form>

        <div class="device-info-badge">
            <i class="fa-solid fa-shield-halved"></i> Sistem Kunci 1 Perangkat Aktif.<br>
            Perangkat Kamu: <strong id="detectedDevice">Memuat data HP/PC...</strong>
        </div>
    </div>

    <script>
        // =========================================================================
        // 1. URL RAW DATABASE GITHUB DISESUAIKAN DENGAN REPO KAMU
        // =========================================================================
        const GITHUB_DATABASE_URL = "https://raw.githubusercontent.com/rezaputramaulana01092010-cmyk/Sertifikat2/main/database.json";

        // Isikan Webhook Discord milikmu di sini jika ingin dipakai
        const DISCORD_WEBHOOK_URL = "";

        // =========================================================================
        // 2. DETEKSI INFORMASI PERANGKAT & DEVICE ID
        // =========================================================================
        function getOrCreateDeviceId() {
            let deviceId = localStorage.getItem('gta_device_id');
            if (!deviceId) {
                deviceId = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase() + '-' + Date.now().toString().slice(-4);
                localStorage.setItem('gta_device_id', deviceId);
            }
            return deviceId;
        }

        function getDeviceName() {
            const ua = navigator.userAgent;
            let os = "Unknown OS";
            let browser = "Unknown Browser";

            if (ua.indexOf("Win") !== -1) os = "Windows PC";
            if (ua.indexOf("Mac") !== -1) os = "MacOS";
            if (ua.indexOf("Android") !== -1) os = "Android Phone";
            if (ua.indexOf("like Mac") !== -1) os = "iPhone/iOS";

            if (ua.indexOf("Chrome") !== -1) browser = "Chrome";
            else if (ua.indexOf("Safari") !== -1) browser = "Safari";
            else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
            else if (ua.indexOf("Edg") !== -1) browser = "Edge";

            return `${os} (${browser})`;
        }

        const currentDeviceId = getOrCreateDeviceId();
        const currentDeviceName = getDeviceName();

        document.getElementById('detectedDevice').innerText = `${currentDeviceName} [${currentDeviceId}]`;

        // =========================================================================
        // 3. KIRIM NOTIFIKASI PEMANTAUAN KE DISCORD
        // =========================================================================
        function sendDiscordLog(username, status, detailMsg) {
            if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.trim() === "") return;

            const isSuccess = status === "SUCCESS";
            const payload = {
                username: "GTA Auth Security Bot",
                avatar_url: "https://i.imgur.com/4M34hi2.png",
                embeds: [{
                    title: isSuccess ? "✅ LOGIN BERHASIL" : "🚨 LOGIN DITOLAK / DIBLOKIR",
                    color: isSuccess ? 3066993 : 15158332,
                    fields: [
                        { name: "User", value: `\`${username}\``, inline: true },
                        { name: "Device ID (HP)", value: `\`${currentDeviceId}\``, inline: true },
                        { name: "Nama Perangkat", value: currentDeviceName, inline: false },
                        { name: "Status Detail", value: detailMsg, inline: false },
                        { name: "Waktu Login", value: new Date().toLocaleString("id-ID"), inline: false }
                    ],
                    footer: { text: "Sistem Pemantauan Single Device GTA" }
                }]
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Discord webhook Error:", err));
        }

        function showAlert(msg, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = msg;
            alertBox.className = `alert-box alert-${type}`;
            alertBox.style.display = 'block';
        }

        function redirectHalamanUtama() {
            // Mengalihkan otomatis ke halaman utama/sertifikat
            window.location.href = "sertifikat.html"; 
        }

        // =========================================================================
        // 4. LOGIKA UTAMA LOGIN & KUNCI 1 PERANGKAT
        // =========================================================================
        async function processLogin() {
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const btnLogin = document.getElementById('btnLogin');

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...';

            try {
                // Fetch data dari RAW GitHub
                const response = await fetch(GITHUB_DATABASE_URL + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Gagal membaca database.");

                const usersData = await response.json();

                // Cek User & Password
                const user = usersData.find(u => u.username === usernameInput && u.password === passwordInput);

                if (!user) {
                    showAlert("Username atau Password salah!", "danger");
                    sendDiscordLog(usernameInput, "FAILED", "Password/Username Salah");
                    resetButton();
                    return;
                }

                if (user.status !== "active") {
                    showAlert("Akun kamu sedang dinonaktifkan!", "danger");
                    sendDiscordLog(usernameInput, "FAILED", "Akun Nonaktif");
                    resetButton();
                    return;
                }

                // Penguncian Single Device
                const lockedUserKey = `locked_device_for_${user.username}`;
                const registeredDeviceId = localStorage.getItem(lockedUserKey);

                if (!registeredDeviceId) {
                    localStorage.setItem(lockedUserKey, currentDeviceId);
                    showAlert("Login Berhasil! Mengalihkan...", "success");
                    sendDiscordLog(user.username, "SUCCESS", `Mendaftarkan perangkat baru: ${currentDeviceName}`);

                    setTimeout(() => {
                        redirectHalamanUtama();
                    }, 1000);

                } else if (registeredDeviceId === currentDeviceId) {
                    showAlert("Login Berhasil! Mengalihkan...", "success");
                    sendDiscordLog(user.username, "SUCCESS", `Login ulang dari perangkat yang sama`);

                    setTimeout(() => {
                        redirectHalamanUtama();
                    }, 1000);

                } else {
                    showAlert("LOGIN DITOLAK! Akun ini sudah terikat di HP lain.", "danger");
                    sendDiscordLog(user.username, "BLOCKED", `PERCOBAAN LOGIN DI HP LAIN! Device ID: ${currentDeviceId} (${currentDeviceName})`);
                }

            } catch (error) {
                console.error(error);
                showAlert("Gagal terhubung ke database. Cek koneksi internet.", "danger");
            }

            resetButton();
        }

        function resetButton() {
            const btnLogin = document.getElementById('btnLogin');
            btnLogin.disabled = false;
            btnLogin.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang';
        }
    </script>
</body>
  </html>
